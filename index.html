<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – Paloma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* ─── Barre du haut (optionnelle, très discrète) ─── */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        header .brand {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.04em;
        }

        header a.dl {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        header a.dl:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.6);
        }

        /* ─── Le PDF prend tout l'espace sous la barre ─── */
        #pdf-frame {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100% - 48px);
            border: none;
        }

        /* Fallback si le navigateur ne supporte pas l'embed PDF */
        .fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            gap: 16px;
            text-align: center;
            padding: 32px;
        }

        .fallback a {
            color: #fff;
            background: #444;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <span class="brand">Paloma — Portfolio</span>
        <a class="dl" href="portfolio_compressed_small.pdf" download="Portfolio_Paloma.pdf">⬇ Télécharger</a>
    </header>

    <!-- Le PDF s'affiche directement comme page principale -->
    <iframe
        id="pdf-frame"
        src="portfolio_compressed_small.pdf"
        type="application/pdf"
        title="Portfolio Paloma"
    ></iframe>

    <!-- Fallback pour mobile où l'iframe PDF ne marche pas -->
    <noscript>
        <div class="fallback" style="display:flex;">
            <p>Ton navigateur ne peut pas afficher le PDF directement.</p>
            <a href="portfolio_compressed_small.pdf">📄 Ouvrir le portfolio</a>
        </div>
    </noscript>

</body>
</html>
